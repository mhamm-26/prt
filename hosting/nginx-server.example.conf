# Staging template; configure TLS and canonical-host redirects before launch.
server {
    listen 80;
    server_name prorecoverytech.com;
    root /srv/prorecoverytech;
    index index.html;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    error_log /var/log/nginx/prt-error.log warn;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    include /etc/nginx/snippets/prt-routes.conf;
}
